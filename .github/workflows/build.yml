name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        global-json-file: global.json

    - name: Test
      run: dotnet test --solution CurlyRpc.slnx -c Release

    - name: Pack preview package
      run: |
        dotnet pack src/CurlyRpc/CurlyRpc.csproj \
          --configuration Release \
          --output artifacts \
          -p:Version=1.0.0-preview-${{ github.run_number }} \
          -p:ContinuousIntegrationBuild=True

    - name: Push preview package to Feedz
      env:
        FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
      run: dotnet nuget push "artifacts/*.nupkg" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/curlyrpc/nuget/index.json --skip-duplicate
