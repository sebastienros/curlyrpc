name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
    - 'README.md'
    - 'doc/**'

jobs:
  build:

    # Don't run on forks
    if: github.repository == 'sebastienros/curlyrpc'
    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        global-json-file: global.json

    - name: Test
      run: dotnet test --solution CurlyRpc.slnx -c Release

    - name: Pack preview packages
      run: dotnet pack src/CurlyRpc/CurlyRpc.csproj --output artifacts --configuration Release --property:VersionSuffix="preview-$GITHUB_RUN_NUMBER" --property:ContinuousIntegrationBuild=True

    - name: Push preview packages to Feedz
      shell: bash
      env:
        FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
      run: |
        set -euo pipefail
        for package in artifacts/*.nupkg; do
          dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/curlyrpc/nuget/index.json --skip-duplicate
        done
